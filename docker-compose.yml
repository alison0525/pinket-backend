services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: pinket-postgres
    environment:
      POSTGRES_DB: pinket
      POSTGRES_USER: pinket
      POSTGRES_PASSWORD: pinket
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pinket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data


volumes:
  postgres-data:
  redis-data: